[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atf-dsp-sdk"
version = "0.1.0"
description = "Programmatic control of Audiotec Fischer ACO-platform DSP amplifiers (MATCH / HELIX / BRAX) over USB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christian Probst" }]
dependencies = ["pyserial>=3.5", "PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atf-dsp-sdk = "atf_dsp.cli:main"

[tool.setuptools]
packages = ["atf_dsp"]

[tool.setuptools.package-data]
atf_dsp = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
